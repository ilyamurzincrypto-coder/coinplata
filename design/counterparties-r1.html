<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>CoinPlata — Контрагенты · r1</title>
<style>
:root{
  --bg:#F1EBDE; --panel:#EAE3D3; --white:#FDFCF8;
  --ink:#1A1915; --mut:#8A8577; --mut-soft:#A39D8C;
  --line:#E2DBCB; --line-2:#CFC8B8;
  --dark:#17150F; --lime:#C8D96F; --lime-ink:#2E3312;
  --warn:#B07A3C; --warn-soft:#F6E3D3;
  --mono:'JetBrains Mono',monospace;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.4}
.wrap{max-width:1400px;margin:0 auto;padding:14px 24px 40px}
.head{display:flex;align-items:flex-end;gap:20px;margin-bottom:14px}
.head h1{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.head .sub{color:var(--mut);margin-top:5px;font-size:13px}
.head .sub b{color:var(--ink);font-weight:600}
.tabs{margin-left:auto;display:flex;gap:6px}
.tab{padding:9px 18px;border-radius:100px;font-weight:500;color:#6E6858;border:1px solid transparent}
.tab.on{background:var(--dark);color:#F4F3EC}
.panel{background:var(--panel);border-radius:26px;padding:8px}
.tools{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 10px;flex-wrap:wrap}
.seg{display:flex;gap:2px;background:var(--white);border:1px solid var(--line);border-radius:100px;padding:3px}
.seg button{padding:7px 15px;border-radius:100px;font-weight:500;color:#6E6858}
.seg button b{font-weight:600;color:var(--mut-soft);margin-left:5px;font-size:12px}
.seg button.on{background:var(--dark);color:#F4F3EC}
.seg button.on b{color:rgba(244,243,236,.6)}
.srch{flex:1;min-width:200px;max-width:360px;display:flex;align-items:center;gap:9px;background:var(--white);border:1px solid var(--line);border-radius:100px;padding:9px 15px;color:var(--mut)}
.arch{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--mut);font-weight:500;font-size:12.5px;padding:9px 13px;border-radius:100px}
.b-add{display:inline-flex;align-items:center;gap:8px;background:var(--lime);color:var(--lime-ink);
  padding:10px 20px;border-radius:100px;font-weight:600}
.t-head,.row{display:grid;grid-template-columns:minmax(240px,1.6fr) 90px 120px 120px 150px 40px;gap:14px;align-items:center;padding:0 18px}
.t-head{padding-top:8px;padding-bottom:8px;color:var(--mut);font-size:11.5px}
.t-head .r,.row .r{text-align:right}
.rows{background:var(--white);border-radius:18px;overflow:hidden}
.row{min-height:52px;padding-top:5px;padding-bottom:5px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.cid{display:flex;align-items:center;gap:12px;min-width:0}
.cava{width:32px;height:32px;flex:none;border-radius:50%;background:var(--panel);color:#5F5A48;
  display:grid;place-items:center;font-size:11px;font-weight:600}
.cava.pr{background:var(--dark);color:var(--lime)}
.cnm b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnm b em{font-style:normal;font-weight:600;color:var(--warn);margin-left:8px;font-size:12px}
.cnm span{font-size:11.5px;color:var(--mut);white-space:nowrap;font-family:var(--mono)}
.num{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:#5A574A;white-space:nowrap}
.net-pos{color:#5C6B1E;font-weight:600}
.net-neg{color:var(--warn);font-weight:600}
.z{color:var(--mut-soft);font-weight:400}
.act{text-align:right;font-size:12.5px;color:var(--mut);white-space:nowrap}
.chev{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(26,25,21,.045);justify-self:end}
@media (max-width:1100px){
  .t-head,.row{grid-template-columns:minmax(0,1.6fr) 120px 150px 40px}
  .col-x{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>Контрагенты</h1>
      <div class="sub"><b>21</b> всего · 19 клиентов · 2 партнёра · за месяц <b>14 сделок</b> · оборот <b>$182 300</b></div>
    </div>
    <div class="tabs">
      <button class="tab on">Список</button>
      <button class="tab">Обязательства</button>
    </div>
  </div>

  <div class="panel">
    <div class="tools">
      <div class="seg">
        <button class="on">Все <b>21</b></button>
        <button>Клиенты <b>19</b></button>
        <button>Партнёры <b>2</b></button>
      </div>
      <div class="srch"><input placeholder="Имя, telegram, телефон"></div>
      <button class="arch">Активные <span class="cv"></span></button>
      <button class="b-add"><span class="pl">＋</span>Добавить</button>
    </div>

    <div class="t-head">
      <div>Контрагент</div>
      <div class="r col-x">Сделок</div>
      <div class="r col-x">Оборот</div>
      <div class="r">Net / LTV</div>
      <div class="r">Активность</div>
      <div></div>
    </div>

    <div class="rows">
      <div class="row">
        <div class="cid"><span class="cava">MB</span>
          <div class="cnm"><b>maxim_blk</b><span>@maxim_blk</span></div>
        </div>
        <div class="num col-x">6</div>
        <div class="num col-x">$96 400</div>
        <div class="num net-pos">+$2 140</div>
        <div class="act">сегодня · 14:03</div>
        <span class="chev">›</span>
      </div>
      <div class="row">
        <div class="cid"><span class="cava pr">TL</span>
          <div class="cnm"><b>Tolunay <em>партнёр</em></b><span>нал · TRY</span></div>
        </div>
        <div class="num col-x">4</div>
        <div class="num col-x">$61 800</div>
        <div class="num net-neg">−$780</div>
        <div class="act">сегодня · 11:16</div>
        <span class="chev">›</span>
      </div>
      <div class="row">
        <div class="cid"><span class="cava">FT</span>
          <div class="cnm"><b>fast token</b><span>@fasttoken_ex</span></div>
        </div>
        <div class="num col-x z">0</div>
        <div class="num col-x z">$0</div>
        <div class="num z">—</div>
        <div class="act z">—</div>
        <span class="chev">›</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
